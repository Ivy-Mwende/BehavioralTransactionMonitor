spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/btm_db
    username: btm_user
    password: btm_password123
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  redis:
    host: localhost
    port: 6379
    timeout: 60000ms

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

  security:
    user:
      name: admin
      password: admin123

server:
  port: 8080

logging:
  level:
    root: INFO
    com.fintech.btm: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha