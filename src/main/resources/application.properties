# Security
spring.security.user.name=admin
spring.security.user.password=admin123

# JWT Secret (change in production)
jwt.secret=your-secret-key-change-this-in-production-at-least-32-characters-long
jwt.expiration=86400000

# Server
server.port=8080
spring.application.name=BehavioralTransactionMonitor

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/btm_db
spring.datasource.username=btm_user
spring.datasource.password=btm_password123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# Logging
logging.level.root=INFO
logging.level.com.fintech.btm=DEBUG
logging.level.org.springframework.web=DEBUG

# Kafka
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=btm-consumer-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.fintech.btm.dto
spring.kafka.consumer.properties.spring.json.type.mapping=transaction:com.fintech.btm.dto.TransactionEvent
spring.kafka.consumer.auto-offset-reset=earliest

# Redis
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=60000ms
spring.redis.jedis.pool.max-active=8
spring.redis.jedis.pool.max-idle=8
spring.redis.jedis.pool.min-idle=0

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false