# Security
spring.security.user.name=admin
spring.security.user.password=admin123

# JWT Secret (change in production)
jwt.secret=your-secret-key-change-this-in-production-at-least-32-characters-long
jwt.expiration=86400000

# Server
server.port=8080spring.application.name=BehavioralTransactionMonitor

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/btm_db
spring.datasource.username=btm_user
spring.datasource.password=btm_password123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Server
server.servlet.context-path=/api

# Logging
logging.level.root=INFO
logging.level.com.fintech.btm=DEBUG